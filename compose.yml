services:
  flycloud-helper:
    # 默认直接拉取公开镜像；从源码构建时叠加 compose.build.yml。
    image: fbinba3955/flycloud-helper:${FLYCLOUDHELPER_IMAGE_TAG:-latest}
    container_name: flycloud-helper
    restart: unless-stopped
    ports:
      - "${FLYCLOUDHELPER_HOST_PORT:-${FLYMBYSCANNER_HOST_PORT:-9934}}:9934"
    environment:
      NODE_ENV: production
      FLYCLOUDHELPER_API_HOST: 0.0.0.0
      FLYCLOUDHELPER_API_PORT: 9934
      # NAS 使用宿主机目录挂载时，可改成该目录实际所有者的 UID/GID。
      FLYCLOUDHELPER_PUID: "${FLYCLOUDHELPER_PUID:-1000}"
      FLYCLOUDHELPER_PGID: "${FLYCLOUDHELPER_PGID:-1000}"
      FLYCLOUDHELPER_PUBLIC_BASE_URL: "${FLYCLOUDHELPER_PUBLIC_BASE_URL:-}"
      FLYCLOUDHELPER_DATABASE_TYPE: "${FLYCLOUDHELPER_DATABASE_TYPE:-${FLYMBYSCANNER_DATABASE_TYPE:-sqlite}}"
      FLYCLOUDHELPER_SQLITE_PATH: "${FLYCLOUDHELPER_SQLITE_PATH:-${FLYMBYSCANNER_SQLITE_PATH:-/data/database/flycloud-helper.db}}"
      FLYCLOUDHELPER_DATABASE_URL: "${FLYCLOUDHELPER_DATABASE_URL:-${FLYMBYSCANNER_DATABASE_URL:-}}"
      FLYCLOUDHELPER_DATABASE_URL_FILE: "${FLYCLOUDHELPER_DATABASE_URL_FILE:-}"
      FLYCLOUDHELPER_DATABASE_HOST: "${FLYCLOUDHELPER_DATABASE_HOST:-}"
      FLYCLOUDHELPER_DATABASE_PORT: "${FLYCLOUDHELPER_DATABASE_PORT:-}"
      FLYCLOUDHELPER_DATABASE_NAME: "${FLYCLOUDHELPER_DATABASE_NAME:-}"
      FLYCLOUDHELPER_DATABASE_USER: "${FLYCLOUDHELPER_DATABASE_USER:-}"
      FLYCLOUDHELPER_DATABASE_PASSWORD: "${FLYCLOUDHELPER_DATABASE_PASSWORD:-}"
      FLYCLOUDHELPER_DATABASE_PASSWORD_FILE: "${FLYCLOUDHELPER_DATABASE_PASSWORD_FILE:-}"
      FLYCLOUDHELPER_DATABASE_AUTO_CREATE: "${FLYCLOUDHELPER_DATABASE_AUTO_CREATE:-true}"
      FLYCLOUDHELPER_HUAWEI_BINDING_PROOF_SECRET: "${FLYCLOUDHELPER_HUAWEI_BINDING_PROOF_SECRET:-}"
      FLYCLOUDHELPER_HUAWEI_BINDING_PROOF_SECRET_FILE: "${FLYCLOUDHELPER_HUAWEI_BINDING_PROOF_SECRET_FILE:-}"
      FLYCLOUDHELPER_CREDENTIAL_MASTER_KEY: "${FLYCLOUDHELPER_CREDENTIAL_MASTER_KEY:-${FLYMBYSCANNER_CREDENTIAL_MASTER_KEY:-}}"
      FLYCLOUDHELPER_GENERATED_CREDENTIAL_KEY_PATH: /data/secrets/credential-master-key
      FLYCLOUDHELPER_TMDB_PER_KEY_CONCURRENCY: "${FLYCLOUDHELPER_TMDB_PER_KEY_CONCURRENCY:-${FLYMBYSCANNER_TMDB_PER_KEY_CONCURRENCY:-1}}"
      FLYCLOUDHELPER_TMDB_MAX_CONCURRENCY: "${FLYCLOUDHELPER_TMDB_MAX_CONCURRENCY:-${FLYMBYSCANNER_TMDB_MAX_CONCURRENCY:-32}}"
      FLYCLOUDHELPER_MUSICBRAINZ_USER_AGENT: "${FLYCLOUDHELPER_MUSICBRAINZ_USER_AGENT:-${FLYMBYSCANNER_MUSICBRAINZ_USER_AGENT:-FlyCloudHelper/0.1.5 (self-hosted)}}"
      FLYCLOUDHELPER_ACOUSTID_API_KEY: "${FLYCLOUDHELPER_ACOUSTID_API_KEY:-${FLYMBYSCANNER_ACOUSTID_API_KEY:-}}"
      FLYCLOUDHELPER_FPCALC_PATH: "${FLYCLOUDHELPER_FPCALC_PATH:-${FLYMBYSCANNER_FPCALC_PATH:-}}"
      FLYCLOUDHELPER_WEB_SESSION_TTL_SECONDS: "${FLYCLOUDHELPER_WEB_SESSION_TTL_SECONDS:-${FLYMBYSCANNER_WEB_SESSION_TTL_SECONDS:-2592000}}"
      FLYCLOUDHELPER_ACCESS_TOKEN_TTL_SECONDS: "${FLYCLOUDHELPER_ACCESS_TOKEN_TTL_SECONDS:-${FLYMBYSCANNER_ACCESS_TOKEN_TTL_SECONDS:-3600}}"
      FLYCLOUDHELPER_REFRESH_TOKEN_TTL_SECONDS: "${FLYCLOUDHELPER_REFRESH_TOKEN_TTL_SECONDS:-${FLYMBYSCANNER_REFRESH_TOKEN_TTL_SECONDS:-2592000}}"
      FLYCLOUDHELPER_COOKIE_SECURE: "${FLYCLOUDHELPER_COOKIE_SECURE:-${FLYMBYSCANNER_COOKIE_SECURE:-false}}"
      FLYCLOUDHELPER_WORKER_ENABLED: "${FLYCLOUDHELPER_WORKER_ENABLED:-${FLYMBYSCANNER_WORKER_ENABLED:-true}}"
      FLYCLOUDHELPER_WORKER_CONCURRENCY: "${FLYCLOUDHELPER_WORKER_CONCURRENCY:-${FLYMBYSCANNER_WORKER_CONCURRENCY:-5}}"
      FLYCLOUDHELPER_WORKER_POLL_INTERVAL_MS: "${FLYCLOUDHELPER_WORKER_POLL_INTERVAL_MS:-${FLYMBYSCANNER_WORKER_POLL_INTERVAL_MS:-1000}}"
      # 官方镜像已经内置 ffprobe；以下参数只控制独立规格队列，不依赖宿主机安装。
      FLYCLOUDHELPER_FFPROBE_PATH: "${FLYCLOUDHELPER_FFPROBE_PATH:-/usr/bin/ffprobe}"
      FLYCLOUDHELPER_MEDIA_PROBE_CONCURRENCY: "${FLYCLOUDHELPER_MEDIA_PROBE_CONCURRENCY:-1}"
      FLYCLOUDHELPER_MEDIA_PROBE_POLL_INTERVAL_MS: "${FLYCLOUDHELPER_MEDIA_PROBE_POLL_INTERVAL_MS:-2000}"
      FLYCLOUDHELPER_FFPROBE_TIMEOUT_MS: "${FLYCLOUDHELPER_FFPROBE_TIMEOUT_MS:-60000}"
      FLYCLOUDHELPER_FFPROBE_ANALYZE_DURATION_US: "${FLYCLOUDHELPER_FFPROBE_ANALYZE_DURATION_US:-10000000}"
      FLYCLOUDHELPER_FFPROBE_PROBE_SIZE_BYTES: "${FLYCLOUDHELPER_FFPROBE_PROBE_SIZE_BYTES:-10485760}"
      FLYCLOUDHELPER_PLUGIN_DIR: /data/plugins
      FLYCLOUDHELPER_EXPORT_DIR: /data/exports
      FLYCLOUDHELPER_MIGRATION_DIR: /data/migrations
      FLYCLOUDHELPER_WEB_DIST_DIR: /app/web/dist
      FLYCLOUDHELPER_PLUGIN_MAX_BYTES: "${FLYCLOUDHELPER_PLUGIN_MAX_BYTES:-${FLYMBYSCANNER_PLUGIN_MAX_BYTES:-10485760}}"
      FLYCLOUDHELPER_PLUGIN_MAX_FILES: "${FLYCLOUDHELPER_PLUGIN_MAX_FILES:-${FLYMBYSCANNER_PLUGIN_MAX_FILES:-100}}"
      FLYCLOUDHELPER_ALLOW_INSECURE_HTTP: "${FLYCLOUDHELPER_ALLOW_INSECURE_HTTP:-${FLYMBYSCANNER_ALLOW_INSECURE_HTTP:-true}}"
    volumes:
      - flycloud_helper_data:/data

volumes:
  flycloud_helper_data:
