services:
  flycloud-helper:
    environment:
      FLYCLOUDHELPER_DATABASE_TYPE: postgres
      FLYCLOUDHELPER_DATABASE_HOST: postgres
      FLYCLOUDHELPER_DATABASE_PORT: 5432
      FLYCLOUDHELPER_DATABASE_NAME: "${POSTGRES_DB:-flycloud_helper}"
      FLYCLOUDHELPER_DATABASE_USER: "${POSTGRES_USER:-flymby}"
      FLYCLOUDHELPER_DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?请设置PostgreSQL密码}"
      FLYCLOUDHELPER_DATABASE_AUTO_CREATE: "${FLYCLOUDHELPER_DATABASE_AUTO_CREATE:-true}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-flycloud_helper}"
      POSTGRES_USER: "${POSTGRES_USER:-flymby}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请设置PostgreSQL密码}"
    volumes:
      - flycloud_helper_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  flycloud_helper_postgres:
