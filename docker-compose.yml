name: flycloud-helper

services:
  flycloud-helper:
    # FlyCloudHelper 生产镜像已经集成 Web 前端、后台 API 和扫描 Worker。
    image: fbinba3955/flycloud-helper:${FLYCLOUDHELPER_IMAGE_TAG:-latest}
    container_name: flycloud-helper
    restart: unless-stopped
    ports:
      - "${FLYCLOUDHELPER_HOST_PORT:-9934}:9934"
    environment:
      NODE_ENV: production
      FLYCLOUDHELPER_API_HOST: 0.0.0.0
      FLYCLOUDHELPER_API_PORT: 9934
      # NAS 使用宿主机目录挂载时，可改成该目录实际所有者的 UID/GID。
      FLYCLOUDHELPER_PUID: "${FLYCLOUDHELPER_PUID:-1000}"
      FLYCLOUDHELPER_PGID: "${FLYCLOUDHELPER_PGID:-1000}"
      FLYCLOUDHELPER_PUBLIC_BASE_URL: "${FLYCLOUDHELPER_PUBLIC_BASE_URL:-}"
      # 默认使用 SQLite；需要外部数据库时在同目录的 .env 中覆盖这些字段。
      FLYCLOUDHELPER_DATABASE_TYPE: "${FLYCLOUDHELPER_DATABASE_TYPE:-sqlite}"
      FLYCLOUDHELPER_SQLITE_PATH: "${FLYCLOUDHELPER_SQLITE_PATH:-/data/database/flycloud-helper.db}"
      FLYCLOUDHELPER_DATABASE_HOST: "${FLYCLOUDHELPER_DATABASE_HOST:-}"
      FLYCLOUDHELPER_DATABASE_PORT: "${FLYCLOUDHELPER_DATABASE_PORT:-}"
      FLYCLOUDHELPER_DATABASE_NAME: "${FLYCLOUDHELPER_DATABASE_NAME:-}"
      FLYCLOUDHELPER_DATABASE_USER: "${FLYCLOUDHELPER_DATABASE_USER:-}"
      FLYCLOUDHELPER_DATABASE_PASSWORD: "${FLYCLOUDHELPER_DATABASE_PASSWORD:-}"
      FLYCLOUDHELPER_DATABASE_AUTO_CREATE: "${FLYCLOUDHELPER_DATABASE_AUTO_CREATE:-true}"
      FLYCLOUDHELPER_COOKIE_SECURE: "${FLYCLOUDHELPER_COOKIE_SECURE:-false}"
      FLYCLOUDHELPER_ALLOW_INSECURE_HTTP: "${FLYCLOUDHELPER_ALLOW_INSECURE_HTTP:-true}"
      FLYCLOUDHELPER_WORKER_CONCURRENCY: "${FLYCLOUDHELPER_WORKER_CONCURRENCY:-2}"
      # 官方镜像已经内置 ffprobe；开启服务级规格分析后无需宿主机安装。
      FLYCLOUDHELPER_FFPROBE_PATH: "${FLYCLOUDHELPER_FFPROBE_PATH:-/usr/bin/ffprobe}"
      FLYCLOUDHELPER_MEDIA_PROBE_CONCURRENCY: "${FLYCLOUDHELPER_MEDIA_PROBE_CONCURRENCY:-1}"
      FLYCLOUDHELPER_MEDIA_PROBE_POLL_INTERVAL_MS: "${FLYCLOUDHELPER_MEDIA_PROBE_POLL_INTERVAL_MS:-2000}"
      FLYCLOUDHELPER_FFPROBE_TIMEOUT_MS: "${FLYCLOUDHELPER_FFPROBE_TIMEOUT_MS:-60000}"
      FLYCLOUDHELPER_FFPROBE_ANALYZE_DURATION_US: "${FLYCLOUDHELPER_FFPROBE_ANALYZE_DURATION_US:-10000000}"
      FLYCLOUDHELPER_FFPROBE_PROBE_SIZE_BYTES: "${FLYCLOUDHELPER_FFPROBE_PROBE_SIZE_BYTES:-10485760}"
      # 凭据主密钥会在首次启动时生成到持久卷，升级容器时必须保留该卷。
      FLYCLOUDHELPER_GENERATED_CREDENTIAL_KEY_PATH: /data/secrets/credential-master-key
      FLYCLOUDHELPER_PLUGIN_DIR: /data/plugins
      FLYCLOUDHELPER_EXPORT_DIR: /data/exports
      FLYCLOUDHELPER_MIGRATION_DIR: /data/migrations
      FLYCLOUDHELPER_WEB_DIST_DIR: /app/web/dist
    volumes:
      - flycloud_helper_data:/data

volumes:
  flycloud_helper_data:
